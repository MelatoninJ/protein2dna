name: Mus musculus (mouse)
slug: mmusculus
taxid: 10090

# The codon_usage block is generated -- do not edit by hand.
# Regenerate with: python tools/build_codon_table.py --host mmusculus --write
codon_usage:
  source: "python_codon_tables 0.1.18, table 'm_musculus_10090' (Mus musculus, Kazusa CUTG)"
  note: "Whole-genome usage for the species, not for a cell line, strain or expression level"
  verified: true
  # fraction of each amino acid's codons, per codon
  table:
    A: {GCC: 0.38, GCT: 0.29, GCA: 0.23, GCG: 0.09}
    C: {TGC: 0.52, TGT: 0.48}
    D: {GAC: 0.55, GAT: 0.45}
    E: {GAG: 0.59, GAA: 0.41}
    F: {TTC: 0.56, TTT: 0.44}
    G: {GGC: 0.33, GGA: 0.26, GGG: 0.23, GGT: 0.18}
    H: {CAC: 0.59, CAT: 0.41}
    I: {ATC: 0.5, ATT: 0.34, ATA: 0.16}
    K: {AAG: 0.61, AAA: 0.39}
    L: {CTG: 0.39, CTC: 0.2, CTT: 0.13, TTG: 0.13, CTA: 0.08, TTA: 0.07}
    M: {ATG: 1}
    N: {AAC: 0.57, AAT: 0.43}
    P: {CCT: 0.31, CCC: 0.3, CCA: 0.29, CCG: 0.1}
    Q: {CAG: 0.74, CAA: 0.26}
    R: {AGA: 0.22, AGG: 0.22, CGG: 0.19, CGC: 0.17, CGA: 0.12, CGT: 0.08}
    S: {AGC: 0.24, TCC: 0.22, TCT: 0.2, AGT: 0.15, TCA: 0.14, TCG: 0.05}
    T: {ACC: 0.35, ACA: 0.29, ACT: 0.25, ACG: 0.1}
    V: {GTG: 0.46, GTC: 0.25, GTT: 0.17, GTA: 0.12}
    W: {TGG: 1}
    Y: {TAC: 0.57, TAT: 0.43}
  stop: {TGA: 0.49, TAA: 0.28, TAG: 0.23}

# Derived from the table above: codons used for under 10% of their amino acid's codons.
# This is a statement about the table, not a claim about tRNA supply.
rare_codons: [CGT, CTA, GCG, TCG, TTA]

# Only the codon table above is taken from a cited source. Everything below is a project
# default that has not been checked against a reference. The motifs and homopolymer
# limits are soft preferences: the optimiser avoids them when it can and names any that
# stay. The GC and repeat limits steer a local search and can be changed per design.
forbidden_motifs:
  - {pattern: AATAAA, reason: polyadenylation signal (premature cleavage inside the coding region)}
  - {pattern: ATTAAA, reason: common variant of the polyadenylation signal}
  - {pattern: ATTTA, reason: AU-rich element pentamer (mRNA instability)}

homopolymer_max: {A: 8, T: 8, G: 5, C: 5}

gc:
  global: [0.35, 0.65]
  window: {size: 50, range: [0.25, 0.75]}

repeats:
  direct_max: 20
  inverted_max: 20

required_elements: []
