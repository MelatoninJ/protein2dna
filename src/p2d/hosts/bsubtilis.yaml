name: Bacillus subtilis
slug: bsubtilis
taxid: 1423
status: released  # released, or development (shown as such and warned about)

# The codon_usage block is generated -- do not edit by hand.
# Regenerate with: python tools/build_codon_table.py --host bsubtilis --write
codon_usage:
  source: "python_codon_tables 0.1.18, table 'b_subtilis_1423' (Bacillus subtilis, Kazusa CUTG)"
  note: "Whole-genome usage for the species, not for a cell line, strain or expression level"
  verified: true
  # fraction of each amino acid's codons, per codon
  table:
    A: {GCA: 0.28, GCG: 0.26, GCT: 0.24, GCC: 0.22}
    C: {TGC: 0.54, TGT: 0.46}
    D: {GAT: 0.64, GAC: 0.36}
    E: {GAA: 0.68, GAG: 0.32}
    F: {TTT: 0.68, TTC: 0.32}
    G: {GGC: 0.34, GGA: 0.31, GGT: 0.19, GGG: 0.16}
    H: {CAT: 0.68, CAC: 0.32}
    I: {ATT: 0.49, ATC: 0.37, ATA: 0.13}
    K: {AAA: 0.7, AAG: 0.3}
    L: {CTG: 0.24, CTT: 0.23, TTA: 0.21, TTG: 0.16, CTC: 0.11, CTA: 0.05}
    M: {ATG: 1}
    N: {AAT: 0.56, AAC: 0.44}
    P: {CCG: 0.44, CCT: 0.28, CCA: 0.19, CCC: 0.09}
    Q: {CAA: 0.52, CAG: 0.48}
    R: {AGA: 0.25, CGC: 0.2, CGT: 0.18, CGG: 0.17, AGG: 0.1, CGA: 0.1}
    S: {AGC: 0.23, TCA: 0.23, TCT: 0.2, TCC: 0.13, AGT: 0.11, TCG: 0.1}
    T: {ACA: 0.4, ACG: 0.27, ACC: 0.17, ACT: 0.16}
    V: {GTT: 0.28, GTC: 0.26, GTG: 0.26, GTA: 0.2}
    W: {TGG: 1}
    Y: {TAT: 0.65, TAC: 0.35}
  stop: {TAA: 0.61, TGA: 0.24, TAG: 0.15}

# Derived from the table above: codons used for under 10% of their amino acid's codons.
# This is a statement about the table, not a claim about tRNA supply.
rare_codons: [CCC, CTA]

# Only the codon table above and the cited items below come from sources. The motif is a soft
# preference: the optimiser avoids it when it can and names any that stay. B. subtilis has a
# Chi site (5'-AGCGG, Chedin et al. 2000, J Mol Biol 298:7), but five bases occur so often that
# avoiding it would constrain the codons without a stated benefit, so it is not listed.
forbidden_motifs:
  - pattern: AGGAGG
    reason: internal Shine-Dalgarno-like sequence (ribosome pausing)
    source: "Li, Oh & Weissman 2012, Nature 484:538, doi:10.1038/nature10965 (includes B. subtilis 168)"

required_elements: []

# ---- limits measured on the host's genome (tools/build_limits.py): do not edit ----
limits_source:
  genome: "NC_000964.3, Bacillus subtilis subsp. subtilis str. 168 complete genome; 4117 coding sequences of 150 bp or more"
  gc: "central 99% of gene GC and of GC in 50 bp windows (0.5th to 99.5th percentile)"
  homopolymer: "longest run found in at least 3 coding sequences"
  repeats: "direct: Shen & Huang 1986, Genetics 112:441 (minimal length for efficient RecBC-dependent recombination, 23 to 27 bp); inverted: no cited threshold, left off"
homopolymer_max: {A: 9, T: 8, G: 7, C: 7}

gc:
  global: [0.28, 0.53]
  window: {size: 50, range: [0.24, 0.66]}

repeats:
  direct_max: 22
  inverted_max: 200
