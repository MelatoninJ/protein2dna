name: Homo sapiens (human)
slug: hsapiens
taxid: 9606
status: development  # released, or development (shown as such and warned about)

# The codon_usage block is generated -- do not edit by hand.
# Regenerate with: python tools/build_codon_table.py --host hsapiens --write
codon_usage:
  source: "python_codon_tables 0.1.18, table 'h_sapiens_9606' (Homo sapiens, Kazusa CUTG)"
  note: "Whole-genome usage for the species, not for a cell line, strain or expression level"
  verified: true
  # fraction of each amino acid's codons, per codon
  table:
    A: {GCC: 0.4, GCT: 0.27, GCA: 0.23, GCG: 0.11}
    C: {TGC: 0.54, TGT: 0.46}
    D: {GAC: 0.54, GAT: 0.46}
    E: {GAG: 0.58, GAA: 0.42}
    F: {TTC: 0.54, TTT: 0.46}
    G: {GGC: 0.34, GGA: 0.25, GGG: 0.25, GGT: 0.16}
    H: {CAC: 0.58, CAT: 0.42}
    I: {ATC: 0.47, ATT: 0.36, ATA: 0.17}
    K: {AAG: 0.57, AAA: 0.43}
    L: {CTG: 0.4, CTC: 0.2, CTT: 0.13, TTG: 0.13, TTA: 0.08, CTA: 0.07}
    M: {ATG: 1}
    N: {AAC: 0.53, AAT: 0.47}
    P: {CCC: 0.32, CCT: 0.29, CCA: 0.28, CCG: 0.11}
    Q: {CAG: 0.73, CAA: 0.27}
    R: {AGA: 0.21, AGG: 0.21, CGG: 0.2, CGC: 0.18, CGA: 0.11, CGT: 0.08}
    S: {AGC: 0.24, TCC: 0.22, TCT: 0.19, AGT: 0.15, TCA: 0.15, TCG: 0.05}
    T: {ACC: 0.36, ACA: 0.28, ACT: 0.25, ACG: 0.11}
    V: {GTG: 0.46, GTC: 0.24, GTT: 0.18, GTA: 0.12}
    W: {TGG: 1}
    Y: {TAC: 0.56, TAT: 0.44}
  stop: {TGA: 0.47, TAA: 0.3, TAG: 0.24}

# Derived from the table above: codons used for under 10% of their amino acid's codons.
# This is a statement about the table, not a claim about tRNA supply.
rare_codons: [CGT, CTA, TCG, TTA]

# Only the codon table above is taken from a cited source. Everything below is a project
# default that has not been checked against a reference. The motifs and homopolymer
# limits are soft preferences: the optimiser avoids them when it can and names any that
# stay. The GC and repeat limits steer a local search and can be changed per design.
forbidden_motifs:
  - {pattern: AATAAA, reason: polyadenylation signal (premature cleavage inside the coding region)}
  - {pattern: ATTAAA, reason: common variant of the polyadenylation signal}
  - {pattern: ATTTA, reason: AU-rich element pentamer (mRNA instability)}

homopolymer_max: {A: 8, T: 8, G: 5, C: 5}

gc:
  global: [0.35, 0.65]
  window: {size: 50, range: [0.25, 0.75]}

repeats:
  direct_max: 20
  inverted_max: 20

required_elements: []
