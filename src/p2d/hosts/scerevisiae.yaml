# Only the codon table above is taken from a cited source. Everything below is a project
# default that has not been checked against a reference. The motifs and homopolymer
# limits are soft preferences: the optimiser avoids them when it can and names any that
# stay. The GC and repeat limits steer a local search and can be changed per design.
forbidden_motifs: []  # none listed for this host

homopolymer_max: {A: 8, T: 8, G: 5, C: 5}

gc:
  global: [0.35, 0.65]
  window: {size: 50, range: [0.25, 0.75]}

repeats:
  direct_max: 20
  inverted_max: 20

required_elements: []
