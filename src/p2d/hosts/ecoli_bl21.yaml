name: Escherichia coli BL21(DE3)
slug: ecoli_bl21
taxid: 469008
status: released  # released, or development (shown as such and warned about)

# The codon_usage block is generated -- do not edit by hand.
# Regenerate with: python tools/build_codon_table.py --write
codon_usage:
  source: "python_codon_tables 0.1.18, table 'e_coli_316407' (E. coli K-12, Kazusa CUTG)"
  note: "K-12 table used for a BL21 (B strain) profile -- standard practice; revisit if B-strain-specific data becomes available"
  verified: true
  # fraction of each amino acid's codons, per codon
  table:
    A: {GCG: 0.36, GCC: 0.27, GCA: 0.21, GCT: 0.16}
    C: {TGC: 0.56, TGT: 0.44}
    D: {GAT: 0.63, GAC: 0.37}
    E: {GAA: 0.69, GAG: 0.31}
    F: {TTT: 0.57, TTC: 0.43}
    G: {GGC: 0.41, GGT: 0.34, GGG: 0.15, GGA: 0.11}
    H: {CAT: 0.57, CAC: 0.43}
    I: {ATT: 0.51, ATC: 0.42, ATA: 0.07}
    K: {AAA: 0.76, AAG: 0.24}
    L: {CTG: 0.5, TTA: 0.13, TTG: 0.13, CTC: 0.1, CTT: 0.1, CTA: 0.04}
    M: {ATG: 1}
    N: {AAC: 0.55, AAT: 0.45}
    P: {CCG: 0.53, CCA: 0.19, CCT: 0.16, CCC: 0.12}
    Q: {CAG: 0.65, CAA: 0.35}
    R: {CGC: 0.4, CGT: 0.38, CGG: 0.1, CGA: 0.06, AGA: 0.04, AGG: 0.02}
    S: {AGC: 0.28, AGT: 0.15, TCC: 0.15, TCG: 0.15, TCT: 0.15, TCA: 0.12}
    T: {ACC: 0.44, ACG: 0.27, ACT: 0.16, ACA: 0.13}
    V: {GTG: 0.37, GTT: 0.26, GTC: 0.22, GTA: 0.15}
    W: {TGG: 1}
    Y: {TAT: 0.57, TAC: 0.43}
  stop: {TAA: 0.64, TGA: 0.29, TAG: 0.07}

# Codons rare enough in E. coli that the Rosetta 2 strains carry extra tRNA genes for them: AGA, AGG,
# AUA, CUA, GGA, CCC and CGG (Novagen/Merck Rosetta 2(DE3) product information, cat. 71397).
rare_codons: [AGA, AGG, ATA, CGG, CTA, CCC, GGA]

# Only the codon table above and the cited items below come from sources. The motifs are soft
# preferences: the optimiser avoids them when it can and names any that stay.
forbidden_motifs:
  - pattern: AGGAGG
    reason: internal Shine-Dalgarno-like sequence (ribosome pausing)
    source: "Li, Oh & Weissman 2012, Nature 484:538, doi:10.1038/nature10965"
  - pattern: GCTGGTGG
    reason: Chi site (RecBCD recombination hotspot)
    source: "Chi = 5'-GCTGGTGG-3', the RecBCD recombination hotspot (Smith laboratory; Taylor, Amundsen & Smith 2016, Nucleic Acids Research)"

# Termination efficiency depends on the base after the stop codon. In E. coli the strongest of the
# twelve signals tested was TAAT (about 80%) and the weakest TGAC (about 7%); the base after the
# stop comes from the 3' restriction site (Poole et al. 1995, EMBO Journal, in vivo assay).
termination:
  strong: [TAAT]
  note: "In E. coli TAAT terminates most efficiently (about 80%) and TGAC least (about 7%): Poole et al. 1995, EMBO Journal. A 3' site that starts with T gives TAAT."

required_elements: []

# ---- limits measured on the host's genome (tools/build_limits.py): do not edit ----
limits_source:
  genome: "NC_012971.2, Escherichia coli BL21(DE3), complete sequence; 3996 coding sequences of 150 bp or more"
  gc: "central 99% of gene GC and of GC in 50 bp windows (0.5th to 99.5th percentile)"
  homopolymer: "longest run found in at least 3 coding sequences"
  repeats: "direct: Shen & Huang 1986, Genetics 112:441 (minimal length for efficient RecBC-dependent recombination, 23 to 27 bp); inverted: no cited threshold, left off"
homopolymer_max: {A: 9, T: 9, G: 7, C: 7}

gc:
  global: [0.32, 0.6]
  window: {size: 50, range: [0.28, 0.7]}

repeats:
  direct_max: 22
  inverted_max: 200
